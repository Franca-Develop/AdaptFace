spring.application.name=adaptFace-API

# Banco de dados (MySQL). Para não deixar senha no repositório, defina DB_URL, DB_USER e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adaptface?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate cria/atualiza as tabelas durante o desenvolvimento (trocar por Flyway/validate em produção)
spring.jpa.hibernate.ddl-auto=${DB_SCHEMA_MODE:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

access.face.threshold=${FACE_DISTANCE_THRESHOLD:0.5}
access.machine.api-key=${MACHINE_API_KEY}
app.bootstrap.key=${BOOTSTRAP_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.data.web.pageable.max-page-size=100
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
