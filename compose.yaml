services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: adaptface
      MYSQL_USER: adaptface
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      - adaptface_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - adaptface_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/adaptface?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: adaptface
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      DB_SCHEMA_MODE: ${DB_SCHEMA_MODE:-update}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MACHINE_API_KEY: ${MACHINE_API_KEY:?Defina MACHINE_API_KEY no arquivo .env}
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:?Defina BOOTSTRAP_KEY no arquivo .env}
      FACE_DISTANCE_THRESHOLD: ${FACE_DISTANCE_THRESHOLD:-0.5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - adaptface_internal

  vision:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      ADAPTFACE_API_URL: http://api:8080
      ADAPTFACE_ALLOW_HTTP_HOSTS: api
      MACHINE_API_KEY: ${MACHINE_API_KEY:?Defina MACHINE_API_KEY no arquivo .env}
      MACHINE_MODEL: VISION-WEB
      BACKEND_TIMEOUT: 10
      DEEPFACE_HOME: /app/models
      TZ: America/Sao_Paulo
    volumes:
      - deepface_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - adaptface_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      vision:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - adaptface_internal

volumes:
  adaptface_mysql_data:
  deepface_models:

networks:
  adaptface_internal:
    driver: bridge
