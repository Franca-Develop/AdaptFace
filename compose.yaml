services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: adaptface
      MYSQL_USER: adaptface
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      - adaptface_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - adaptface_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/adaptface?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: adaptface
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      DB_SCHEMA_MODE: ${DB_SCHEMA_MODE:-update}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MACHINE_API_KEY: ${MACHINE_API_KEY:?Defina MACHINE_API_KEY no arquivo .env}
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:?Defina BOOTSTRAP_KEY no arquivo .env}
      FACE_DISTANCE_THRESHOLD: ${FACE_DISTANCE_THRESHOLD:-0.5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - adaptface_internal

volumes:
  adaptface_mysql_data:

networks:
  adaptface_internal:
    driver: bridge
